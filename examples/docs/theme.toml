[theme]
name = "webcore-docs"

# WebCore 4.0 — dark launch identity (warm-neutral dark + signature orange/amber).
[theme.colors]
primary    = "#F97316"
secondary  = "#34D399"
background = "#0C0D11"
surface    = "#14161C"
border     = "#262A33"
text       = "#ECEEF3"
muted      = "#949BA9"
accent     = "#FBBF24"
danger     = "#F87171"
code-bg    = "#0E0F14"

[theme.fonts]
mono = "ui-monospace, SFMono-Regular, 'Fira Code', monospace"
sans = "Inter, system-ui, sans-serif"

[theme.spacing]
xs  = "0.35rem"
sm  = "0.6rem"
md  = "1rem"
lg  = "1.6rem"
xl  = "2.5rem"
xxl = "5rem"

[theme.radius]
sm = "6px"
md = "10px"
lg = "16px"
